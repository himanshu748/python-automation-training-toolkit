<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Python Automation Training Toolkit comeback cover</title>
  <desc id="desc">A before and after cover image showing a fragile training script becoming a usable automation toolkit.</desc>
  <rect width="1600" height="840" fill="#0f172a"/>
  <rect x="96" y="96" width="1408" height="648" rx="28" fill="#111827" stroke="#334155" stroke-width="3"/>
  <text x="144" y="184" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">From Training Script to Automation Toolkit</text>
  <text x="146" y="238" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="30">GitHub Finish-Up-A-Thon comeback story</text>

  <g transform="translate(144 310)">
    <rect width="590" height="300" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="34" y="58" fill="#f97316" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Before</text>
    <text x="34" y="112" fill="#e2e8f0" font-family="SFMono-Regular, Consolas, monospace" font-size="27">one Tkinter file</text>
    <text x="34" y="160" fill="#e2e8f0" font-family="SFMono-Regular, Consolas, monospace" font-size="27">import-time crashes</text>
    <text x="34" y="208" fill="#e2e8f0" font-family="SFMono-Regular, Consolas, monospace" font-size="27">hardcoded placeholders</text>
    <text x="34" y="256" fill="#e2e8f0" font-family="SFMono-Regular, Consolas, monospace" font-size="27">no tests or install path</text>
  </g>

  <g transform="translate(866 310)">
    <rect width="590" height="300" rx="18" fill="#052e2b" stroke="#14b8a6" stroke-width="2"/>
    <text x="34" y="58" fill="#5eead4" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">After</text>
    <text x="34" y="112" fill="#f0fdfa" font-family="SFMono-Regular, Consolas, monospace" font-size="27">safe env config</text>
    <text x="34" y="160" fill="#f0fdfa" font-family="SFMono-Regular, Consolas, monospace" font-size="27">CLI plus GUI</text>
    <text x="34" y="208" fill="#f0fdfa" font-family="SFMono-Regular, Consolas, monospace" font-size="27">lazy optional imports</text>
    <text x="34" y="256" fill="#f0fdfa" font-family="SFMono-Regular, Consolas, monospace" font-size="27">unit tests and docs</text>
  </g>

  <path d="M770 455h66" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  <path d="M820 425l36 30-36 30" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="144" y="690" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24">github.com/himanshu748/python-automation-training-toolkit</text>
</svg>
